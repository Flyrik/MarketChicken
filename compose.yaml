
services: #nos services (conteneurs) à lancer

  postgres:
    image: postgres:17
    container_name: market-postgres
    restart: unless-stopped
    environment: # variables d'environnement À L'INTÉRIEUR du conteneur
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Define ORDERS_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Define INVENTORY_DB_PASSWORD in .env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?Define PAYMENTS_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:  # quels dossiers/fichiers partager entre la machine et le conteneur
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: market-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: market
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD in .env}
      CATALOG_MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:?Define CATALOG_MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: market-rustfs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Define OBJECT_STORAGE_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Define OBJECT_STORAGE_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  raw-ingestion:
    build:
      context: ./data/raw-ingestion
    profiles:
      - data
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: market
      DB_USER: inventory_svc
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Define INVENTORY_DB_PASSWORD in .env}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: market_catalog
      MONGO_USERNAME: catalog_svc
      MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:?Define CATALOG_MONGO_PASSWORD in .env}
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_BUCKET: market-data
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Define OBJECT_STORAGE_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Define OBJECT_STORAGE_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  catalog:
    build:
      context: ./services/catalog
    container_name: market-catalog
    restart: unless-stopped
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: market_catalog
      MONGO_USERNAME: catalog_svc
      MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD:?Define CATALOG_MONGO_PASSWORD in .env}
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  catalog-test:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/catalog:/app:ro
      - catalog_test_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm test"
    profiles:
      - test

  inventory:
    build:
      context: ./services/inventory
    container_name: market-inventory
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: market
      DB_USER: inventory_svc
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Define INVENTORY_DB_PASSWORD in .env}
      PORT: 4001
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  object_storage_data:
  catalog_test_node_modules:
